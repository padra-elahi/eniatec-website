# nginx vhost proxying to this site's container (`docker compose up -d --build`
# from the repository root, which listens on 127.0.0.1:8080).
#
# This file is deliberately HTTP-only. Install it FIRST, confirm the site
# answers on port 80, then run:
#
#     sudo certbot --nginx -d eniatec.tech -d www.eniatec.tech
#
# certbot copies this server block into a TLS one, adds the certificate paths
# and the HTTP→HTTPS redirect itself.

server {
    listen 80;
    listen [::]:80;
    server_name eniatec.tech www.eniatec.tech;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
