# nginx vhost for a static export of this site on your own VPS.
# Copy the contents of `out/` to /var/www/eniatec and enable this server block.
# TLS: run `certbot --nginx -d eniatec.tech -d www.eniatec.tech` once.

server {
    listen 80;
    listen [::]:80;
    server_name eniatec.tech www.eniatec.tech;
    return 301 https://eniatec.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eniatec.tech;

    ssl_certificate     /etc/letsencrypt/live/eniatec.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eniatec.tech/privkey.pem;

    return 301 https://eniatec.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eniatec.tech;

    root /var/www/eniatec;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/eniatec.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eniatec.tech/privkey.pem;

    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Hashed build assets and self-hosted fonts never change under a given name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
}
