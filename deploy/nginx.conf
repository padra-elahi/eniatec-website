# nginx vhost for a static export of this site.
#
# This file is deliberately HTTP-only. Install it FIRST, confirm the site
# answers on port 80, then run:
#
#     sudo certbot --nginx -d eniatec.tech -d www.eniatec.tech
#
# certbot copies this server block into a TLS one, adds the certificate paths
# and the HTTP→HTTPS redirect itself. Writing the ssl_certificate lines by hand
# beforehand would make `nginx -t` fail, because the certificate does not exist
# until certbot has run.

server {
    listen 80;
    listen [::]:80;
    server_name eniatec.tech www.eniatec.tech;

    root /var/www/eniatec;
    index index.html;

    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Hashed build assets and self-hosted fonts never change under a given name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
}
