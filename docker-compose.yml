# Builds the site into a Node image and runs it.
#
#   cp .env.example .env   # then set ADMIN_PASSWORD and SESSION_SECRET
#   docker compose up -d --build
#
# Port 8080 is bound to localhost only: this container is meant to sit behind a
# reverse proxy that terminates TLS (Caddy, Traefik, nginx). If you want to
# reach it directly from outside for a smoke test, change the mapping to
# '8080:80' temporarily.
services:
  eniatec-web:
    build: .
    image: eniatec-website:latest
    container_name: eniatec-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - eniatec-data:/data
    ports:
      - '127.0.0.1:8080:80'

volumes:
  eniatec-data:
